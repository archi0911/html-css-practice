<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HTML TASK</title>
	</head>
<body>
<!-- Section 5 -->
 
<!-- System Analytics -->
  <h2>System Analytics</h2>
  <label for="ServerHealth">Server Health: </label>
  <progress id="ServerHealth" value="32" max="50"> 32% </progress><br>

  <label for="Task">Task Completion: </label>
  <progress id="Task" value="92" max="200"> 92% </progress><br><br>
 
  <table style="width: auto;" border="1" width="200px" height="auto">
    <caption>Device Allocations</caption>
    <tr>
      <th rowspan="2">Device</th>
      <th colspan="3">Usage</th>
      <th rowspan="2">Status</th>
    </tr>
    <tr>
      <th>Active</th>
      <th colspan="2">Locations</th>
    </tr>  
    <tr>
      <td rowspan="2">Laptop</td>
      <td rowspan="2">50</td>
      <td>HQ</td>
      <td>30</td>
      <td rowspan="2">Operational</td>
    </tr>
    <tr>
      <td>Branch</td>
      <td>20</td>
    </tr>
    <tr>
      <td>Server</td>
      <td colspan="3">Under Maintenance</td>
      <td>-</td>
    </tr>
  </table>
  <hr>

</body>
</html>
