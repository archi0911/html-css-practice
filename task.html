<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HTML TASK</title>
	</head>
<body>
<!-- Section 3  -->
 <!-- Pre-Order Now -->
  <h2>Pre-Order Now</h2>
  <form>
    <fieldset>
      <legend>Choose your model</legend>
      <label for="colorchoose">Color:</label>
      <input type="color"  name="colorchoose"><br><br>
      <label for="quantity">Quantity:</label>
      <input type="text" id="quantity" name="quantity"><br><br>
      <label for="start">Delivery Date:</label>
      <input type="date" id="start" name="begin" value="" min="1997-01-01" max="2030-12-31">
    </fieldset><br>

    <label for="searchstores">Search nearby Stores:</label>
    <input type="text" id="searchstores" name="searchstores"><br><br>
    <label for="Reserve"></label>
    <input type="button" value="Reserve" name="Reserve">
  </form>
  <hr><br><br>
  
</body>
</html>
